<table class="table table-striped border"><thead><tr><th>Id</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>
@for (order of orders; track order.id) { <tr><td>{{ order.id }}</td><td>{{ order.customer }}</td><td>{{ order.total | currency }}</td><td>{{ order.status }}</td></tr> }
</tbody></table>
